name: Build and Push Container Images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional Docker tag to publish, for example v1.0.0"
        required: false
        type: string
      checkout_ref:
        description: "Optional git ref to build. Defaults to image_tag when image_tag is set."
        required: false
        type: string
      push_latest:
        description: "Also publish latest and latest_en"
        required: false
        default: true
        type: boolean

env:
  DOCKER_IMAGE_NAME: hangrylabs/melotts
  GHCR_IMAGE_NAME: ghcr.io/hangry-labs/melotts
  UNIDIC_CACHE_PATH: .build-cache/unidic/unidic-3.1.0.zip
  UNIDIC_SOURCE_URL: https://cotonoha-dic.s3-ap-northeast-1.amazonaws.com/unidic-3.1.0.zip
  UNIDIC_SHA256: 638718c4c63625ab300de4c92c67925d54c0e9e3830009eaa992f29819d59c43

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || inputs.image_tag || github.ref }}

      - name: Free up disk space
        run: |
          echo "Initial disk usage:"
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore UniDic archive
        id: unidic-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UNIDIC_CACHE_PATH }}
          key: unidic-${{ runner.os }}-${{ env.UNIDIC_SHA256 }}

      - name: Download UniDic archive on cache miss
        if: steps.unidic-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$UNIDIC_CACHE_PATH")"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$UNIDIC_CACHE_PATH" "$UNIDIC_SOURCE_URL"
          echo "$UNIDIC_SHA256  $UNIDIC_CACHE_PATH" | sha256sum --check --strict

      - name: Verify cached UniDic archive
        if: steps.unidic-cache.outputs.cache-hit == 'true'
        shell: bash
        run: echo "$UNIDIC_SHA256  $UNIDIC_CACHE_PATH" | sha256sum --check --strict

      - name: Prepare image build identity
        shell: bash
        run: |
          echo "APP_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "VCS_REF=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        shell: bash
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF##refs/tags/}"
          elif [[ -n "${{ inputs.image_tag }}" ]]; then
            version="${{ inputs.image_tag }}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Prepare image tags
        id: image_tags
        shell: bash
        run: |
          full_tags=()
          en_tags=()
          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push_latest }}" == "true" ]]; then
            full_tags+=("$DOCKER_IMAGE_NAME:latest" "$GHCR_IMAGE_NAME:latest")
            en_tags+=("$DOCKER_IMAGE_NAME:latest_en" "$GHCR_IMAGE_NAME:latest_en")
          fi
          if [[ -n "$VERSION" ]]; then
            full_tags+=("$DOCKER_IMAGE_NAME:$VERSION" "$GHCR_IMAGE_NAME:$VERSION")
            en_tags+=("$DOCKER_IMAGE_NAME:${VERSION}_en" "$GHCR_IMAGE_NAME:${VERSION}_en")
          fi
          if (( ${#full_tags[@]} == 0 || ${#en_tags[@]} == 0 )); then
            echo "No Docker tags selected for publishing." >&2
            exit 1
          fi
          {
            echo "full_tags<<EOF"
            printf '%s\n' "${full_tags[@]}"
            echo "EOF"
            echo "en_tags<<EOF"
            printf '%s\n' "${en_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push full image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image_tags.outputs.full_tags }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_ID=${{ env.BUILD_DATE }}@${{ env.VCS_REF }}
            VCS_REF=${{ env.VCS_REF }}
            INIT_DOWNLOADS_PROFILE=FULL
            INIT_DOWNLOADS_STRICT=1
            DEFAULT_TTS_LANGUAGES=EN,EN_V2,EN_NEWEST,ES,FR,ZH,JP,KR

      - name: Report disk usage after full image
        shell: bash
        run: |
          df -h
          docker buildx du || true

      - name: Build and push English-family image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image_tags.outputs.en_tags }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_ID=${{ env.BUILD_DATE }}@${{ env.VCS_REF }}
            VCS_REF=${{ env.VCS_REF }}
            INIT_DOWNLOADS_PROFILE=EN_ONLY
            INIT_DOWNLOADS_STRICT=1
            DEFAULT_TTS_LANGUAGES=EN,EN_V2,EN_NEWEST

      - name: Report final disk usage
        if: always()
        shell: bash
        run: |
          df -h
          docker buildx du || true
