<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found | Hangry Labs</title>
    <link rel="icon" type="image/webp" href="assets/hangrylabs_badge.webp">
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow-x: hidden;
        background: #000;
        color: #ffb076;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      h1,
      p {
        margin: 0;
      }

      img {
        display: block;
        max-width: 100%;
      }

      canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
      }

      .page-shell {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        background: rgba(0, 0, 0, 0.5);
      }

      .page-shell::before {
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.24), rgba(0, 0, 0, 0.82)),
          url("assets/hangrylabs_mascot.webp") right -8vw center / min(760px, 70vw) auto no-repeat;
        content: "";
        inset: 0;
        opacity: 0.24;
        pointer-events: none;
        position: fixed;
        z-index: -1;
      }

      .not-found-layout {
        align-items: center;
        display: grid;
        gap: 2rem;
        margin: 0 auto;
        max-width: 64rem;
        min-height: 100vh;
        padding: 2rem 1rem;
        width: 100%;
      }

      .brand-link {
        align-items: center;
        color: inherit;
        display: inline-flex;
        gap: 0.75rem;
        text-decoration: none;
      }

      .brand-badge {
        border: 1px solid rgba(249, 115, 22, 0.4);
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(255, 107, 0, 0.22);
        height: 2.75rem;
        object-fit: cover;
        width: 2.75rem;
      }

      .brand-label {
        color: #ffb076;
        font-size: 1rem;
        font-weight: 800;
      }

      .not-found-copy,
      .actions {
        margin-top: 2rem;
      }

      .error-code {
        font-size: 4.5rem;
        font-weight: 800;
        line-height: 1;
      }

      .error-message {
        color: #ffb076;
        font-size: 1.125rem;
        line-height: 2rem;
        margin-top: 1.25rem;
        max-width: 36rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .brand-card {
        background: rgba(20, 20, 20, 0.94);
        border: 2px solid rgba(255, 107, 0, 0.34);
        border-radius: 12px;
        box-shadow:
          0 0 28px rgba(255, 107, 0, 0.18),
          0 0 80px rgba(255, 60, 0, 0.12);
      }

      .brand-glow {
        color: #ff6b00;
        text-shadow:
          0 0 20px rgba(255, 107, 0, 0.62),
          0 0 48px rgba(255, 60, 0, 0.28);
      }

      .pill {
        border: 1px solid rgba(255, 107, 0, 0.42);
        background: rgba(255, 107, 0, 0.12);
        border-radius: 999px;
        color: #ffb076;
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .pill:hover {
        background: rgba(255, 107, 0, 0.24);
        border-color: #ff6b00;
        color: #ffc08a;
        box-shadow: 0 0 18px rgba(255, 107, 0, 0.34);
      }

      .action-link {
        display: inline-flex;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.5rem 1.25rem;
        text-decoration: none;
      }

      .art-panel {
        padding: 0.75rem;
      }

      .not-found-art {
        border: 2px solid rgba(255, 107, 0, 0.32);
        border-radius: 18px;
        box-shadow:
          0 0 28px rgba(255, 107, 0, 0.22),
          0 0 80px rgba(255, 60, 0, 0.14);
        width: 100%;
      }

      @media (min-width: 640px) {
        .not-found-layout {
          padding-left: 1.5rem;
          padding-right: 1.5rem;
        }
      }

      @media (min-width: 1024px) {
        .not-found-layout {
          grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
          padding-left: 2rem;
          padding-right: 2rem;
        }
      }

      @media (max-width: 639px) {
        .error-code {
          font-size: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="shapes" aria-hidden="true"></canvas>
    <main class="page-shell">
      <section class="not-found-layout">
        <div>
          <a class="brand-link" href="https://hangrylabs.app/" target="_blank" rel="noopener noreferrer">
            <img class="brand-badge" src="assets/hangrylabs_badge.webp" alt="Hangry Labs logo">
            <span class="brand-label">Hangry Labs</span>
          </a>
          <div class="not-found-copy">
            <h1 class="brand-glow error-code">404</h1>
            <p class="error-message">
              This page wandered away from the easy path.
            </p>
            <div class="actions">
              <a class="pill action-link" href="examples/">Back to Melo TTS</a>
              <a class="pill action-link" href="https://github.com/hangry-labs/MeloTTS">GitHub</a>
              <a class="pill action-link" href="https://hangrylabs.app/" target="_blank" rel="noopener noreferrer">hangrylabs.app</a>
            </div>
          </div>
        </div>
        <div class="brand-card art-panel">
          <img class="not-found-art" src="assets/hangrylabs_404.webp" alt="Hangry Labs 404 experiment not found">
        </div>
      </section>
    </main>
    <script src="examples/background.js"></script>
  </body>
</html>
